<!doctype html>
<html lang="pl" translate="no">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Strona jest po polsku, a angielska treść Genius skłania przeglądarki (zwłaszcza Chrome na telefonie) do
         automatycznego tłumaczenia. Tłumacz podmienia teksty w drzewie strony i przy przejściu na inną stronę
         React się wysypuje (biała strona do odświeżenia), więc tłumaczenie wyłączamy. -->
    <meta name="google" content="notranslate" />
    <!-- Tryb ciemny zapamiętany w przeglądarce (ThemeToggle) — ustawiany przed wyświetleniem, bez mignięcia jasnej wersji. -->
    <script>
      try { if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark'); } catch {}
    </script>
    <title>DALK – liga koszykówki amatorskiej</title>
    <!-- Wcześniejsze otwarcie połączeń do serwerów Genius Sports (osadzenia, widget, logo) i jQuery, którego używają. -->
    <link rel="preconnect" href="https://hosted.dcd.shared.geniussports.com" />
    <link rel="preconnect" href="https://hosted.dcd.shared.geniussports.com" crossorigin />
    <link rel="preconnect" href="https://widget.wh.geniussports.com" />
    <link rel="preconnect" href="https://images.statsengine.playbyplay.api.geniussports.com" />
    <link rel="preconnect" href="https://code.jquery.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
